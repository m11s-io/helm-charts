name: "Check values.schema.json"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      charts:
        description: 'Charts to check (comma-separated, e.g. "whoami,fider"). Leave empty for all.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install helm-values-schema-json plugin
        # renovate: datasource=github-releases depName=losisin/helm-values-schema-json
        run: helm plugin install https://github.com/losisin/helm-values-schema-json.git --version v2.6.0 --verify=false

      - name: Check schemas
        env:
          INPUT_CHARTS: ${{ inputs.charts }}
        run: |
          chart_dirs=(charts/*)
          if [[ -n "$INPUT_CHARTS" ]]; then
            IFS=',' read -ra names <<< "$INPUT_CHARTS"
            chart_dirs=()
            for name in "${names[@]}"; do
              name="${name//[[:space:]]/}"
              if [[ ! "$name" =~ ^[a-z0-9][a-z0-9-]*$ || ! -f "charts/$name/Chart.yaml" ]]; then
                echo "Unknown chart: $name" >&2
                exit 1
              fi
              chart_dirs+=("charts/$name")
            done
          fi
          schema=$(mktemp)
          trap 'rm -f "$schema"' EXIT
          for chart in "${chart_dirs[@]}"; do
            grep -q '^type: library$' "$chart/Chart.yaml" && continue
            helm schema --values "$chart/values.yaml" --output "$schema" --draft 7
            diff -u "$chart/values.schema.json" "$schema"
          done
