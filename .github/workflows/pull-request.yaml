name: "Pull Request"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "changedCharts<<EOF" >> $GITHUB_OUTPUT
            echo "$changed" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Check primary image defaults across all charts
        run: python3 scripts/check-image-defaults.py

      - name: Register chart dependency repositories
        if: steps.list-changed.outputs.changed == 'true'
        # Needed by both `ct lint` and `helm dependency build` below: Helm resolves
        # subchart dependencies only against repos in repositories.yaml.
        run: helm repo add valkey https://valkey.io/valkey-helm/

      - name: Lint changed charts
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct lint --target-branch ${{ github.event.repository.default_branch }} \
            --validate-maintainers=false \
            --chart-repos valkey=https://valkey.io/valkey-helm/

      - name: Run helm unittest
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          while IFS= read -r chart; do
            [[ -z "$chart" ]] && continue
            if [[ -d "$chart/tests" ]]; then
              echo "Running unittest for $chart"
              # Needs the repo registered by the step above, not ct lint's side effects.
              [[ -f "$chart/Chart.lock" ]] && helm dependency build "$chart"
              helm unittest "$chart"
              if [[ -f "$chart/tests/verify-integer-overrides.sh" ]]; then
                echo "Running CLI rendering regression checks for $chart"
                bash "$chart/tests/verify-integer-overrides.sh"
              fi
            else
              echo "No tests found for $chart, skipping"
            fi
          done <<< "${{ steps.list-changed.outputs.changedCharts }}"
