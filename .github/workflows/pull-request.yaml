name: "Pull Request"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Install helm-unittest
        # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false

      - name: Register chart dependency repositories
        # Needed by both `ct lint` and `helm dependency build` below: Helm resolves
        # subchart dependencies only against repos in repositories.yaml.
        run: helm repo add valkey https://valkey.io/valkey-helm/

      - name: Build all application chart dependencies
        run: |
          for chart in charts/*; do
            [[ -f "$chart/Chart.yaml" ]] || continue
            grep -q '^type: library$' "$chart/Chart.yaml" && continue
            helm dependency build --skip-refresh "$chart"
          done

      - name: Lint changed charts
        run: |
          ct lint --target-branch ${{ github.event.repository.default_branch }} \
            --validate-maintainers=false \
            --chart-repos valkey=https://valkey.io/valkey-helm/

      - name: Run all application chart unit tests
        run: |
          for chart in charts/*; do
            [[ -d "$chart/tests" ]] || continue
            helm unittest "$chart"
          done

      - name: Test ComfyUI custom-node installer
        # chart-testing prepends its own pip-less venv to PATH. Exercise the
        # setup-python interpreter, matching the pip-equipped workload image.
        run: '"${pythonLocation}/bin/python" -m unittest discover -s charts/comfyui/tests -p "test_*.py"'
