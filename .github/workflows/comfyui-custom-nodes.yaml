name: ComfyUI custom-node runtime
on:
  push:
    branches: [main]
    paths:
      - charts/comfyui/**
      - .github/workflows/comfyui-custom-nodes.yaml
  pull_request:
    paths:
      - charts/comfyui/**
      - .github/workflows/comfyui-custom-nodes.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Build chart dependencies
        run: helm dependency build --skip-refresh charts/comfyui
      - name: Verify separate installer and runtime containers
        run: bash charts/comfyui/tests/verify-custom-nodes.sh
