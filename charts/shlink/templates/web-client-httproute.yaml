{{- if and .Values.webClient.enabled .Values.webClient.httpRoute.enabled -}}
{{- include "m11s-common.httpRoute" (dict "root" . "route" .Values.webClient.httpRoute "name" (printf "%s-web-client" (include "m11s-common.fullname" .)) "backendName" (printf "%s-web-client" (include "m11s-common.fullname" .)) "hostnames" .Values.webClient.httpRoute.hostnames "port" 8080 "extraLabels" (dict "app.kubernetes.io/component" "web-client")) -}}
{{- end -}}
