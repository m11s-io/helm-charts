{{- if and .Values.webClient.enabled .Values.webClient.httpRoute.enabled }}
{{- if not .Values.webClient.httpRoute.parentRefs }}
{{- fail "webClient.httpRoute.parentRefs must contain at least one Gateway reference when webClient.httpRoute.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "shlink.fullname" . }}-web-client
  labels:
    {{- include "shlink.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-client
    {{- with .Values.webClient.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.webClient.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.webClient.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.webClient.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "shlink.fullname" . }}-web-client
          port: 8080
{{- end }}
