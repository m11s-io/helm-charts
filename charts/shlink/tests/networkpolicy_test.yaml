suite: shlink network policy
templates:
  - networkpolicy.yaml

tests:
  - it: renders nothing when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: permits only configured Gateway, DNS, and database workloads
    set:
      db.driver: postgres
      networkPolicy.enabled: true
      networkPolicy.ingress.gateway.namespaceSelector.kubernetes.io/metadata.name: gateway
      networkPolicy.ingress.gateway.podSelector.app.kubernetes.io/name: envoy-gateway
      networkPolicy.egress.dns.namespaceSelector.kubernetes.io/metadata.name: kube-system
      networkPolicy.egress.dns.podSelector.k8s-app: kube-dns
      networkPolicy.egress.database.namespaceSelector.kubernetes.io/metadata.name: database
      networkPolicy.egress.database.podSelector.app.kubernetes.io/name: postgresql
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels.app\.kubernetes\.io/name
          value: postgresql
