apiVersion: v2
name: shlink
description: Deploy Shlink, a self-hosted URL shortener
type: application
version: 0.4.2
# renovate: datasource=docker depName=shlinkio/shlink
appVersion: "5.1.8"
home: https://shlink.io
icon: https://shlink.io/images/shlink-logo-blue.svg
sources:
  - https://github.com/shlinkio/shlink
  - https://github.com/m11s-io/helm-charts
maintainers:
  - name: m11s
    url: https://m11s.io
annotations:
  artifacthub.io/signKey: |
    fingerprint: 6C1DF3F0731DDD4E9047086F039223E48A6FF51F
