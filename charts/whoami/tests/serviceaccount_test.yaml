suite: whoami service account
templates:
  - serviceaccount.yaml

tests:
  - it: creates a named service account with token automount disabled by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-whoami
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: respects configured account name, annotations, and automount override
    set:
      serviceAccount.name: workload-access
      serviceAccount.annotations:
        example.com/iam-role: app
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: metadata.name
          value: workload-access
      - equal:
          path: metadata.annotations["example.com/iam-role"]
          value: app
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: omits resource when creation is disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
