suite: whoami deployment
templates:
  - deployment.yaml

tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "traefik/whoami:v[0-9]+\\.[0-9]+"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: sets --port arg from whoami.port
    set:
      whoami.port: 8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--port=8080"

  - it: adds --verbose arg when whoami.verbose is true
    set:
      whoami.verbose: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--verbose"

  - it: does not add --verbose arg by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--verbose"

  - it: adds --name arg when whoami.name is set
    set:
      whoami.name: my-instance
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--name=my-instance"

  - it: respects replicaCount
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: uses fullnameOverride
    set:
      fullnameOverride: custom-name
    asserts:
      - equal:
          path: metadata.name
          value: custom-name

  - it: drops all capabilities in securityContext
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: runs as non-root
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65534

  - it: sets hostUsers when provided
    set:
      hostUsers: false
    asserts:
      - equal:
          path: spec.template.spec.hostUsers
          value: false

  - it: omits hostUsers by default
    asserts:
      - notExists:
          path: spec.template.spec.hostUsers

  - it: adds user pod labels without changing selectors
    set:
      podLabels:
        team: analytics
        app.kubernetes.io/name: changed
        app.kubernetes.io/instance: changed
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: analytics
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: whoami

      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: whoami
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: uses the chart appVersion for the default image
    chart:
      appVersion: v9.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: traefik/whoami:v9.9.9

  - it: preserves an explicit tag and digest
    set:
      image.tag: v8.8.8@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: traefik/whoami:v8.8.8@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: gives an explicit digest precedence over the tag
    set:
      image.tag: v8.8.8
      image.digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: traefik/whoami@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

  - it: supports custom ServiceAccount names and token mounting
    set:
      serviceAccount.name: custom-account
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-account
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
