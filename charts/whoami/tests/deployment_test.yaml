suite: whoami deployment
templates:
  - deployment.yaml

tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "traefik/whoami:v[0-9]+\\.[0-9]+"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: sets --port arg from whoami.port
    set:
      whoami.port: 8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--port=8080"

  - it: adds --verbose arg when whoami.verbose is true
    set:
      whoami.verbose: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--verbose"

  - it: does not add --verbose arg by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--verbose"

  - it: adds --name arg when whoami.name is set
    set:
      whoami.name: my-instance
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--name=my-instance"

  - it: respects replicaCount
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: uses fullnameOverride
    set:
      fullnameOverride: custom-name
    asserts:
      - equal:
          path: metadata.name
          value: custom-name

  - it: drops all capabilities in securityContext
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: runs as non-root
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65534
