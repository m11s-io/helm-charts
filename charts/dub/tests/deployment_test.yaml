suite: dub deployment
templates:
  - deployment.yaml

tests:
  - it: renders as Deployment
    set:
      dub.appUrl: https://dub.example.com
      auth.existingSecret.name: dub-auth
      db.existingSecret.name: dub-db
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "m11s/dub:[0-9]+\\.[0-9]+\\.[0-9]+"

  - it: sets NEXTAUTH_URL from dub.appUrl
    set:
      dub.appUrl: https://dub.example.com
      auth.existingSecret.name: dub-auth
      db.existingSecret.name: dub-db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTAUTH_URL
            value: "https://dub.example.com"

  - it: sets NEXTAUTH_SECRET from auth.existingSecret
    set:
      dub.appUrl: https://dub.example.com
      auth.existingSecret.name: dub-auth
      db.existingSecret.name: dub-db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTAUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: dub-auth
                key: nextauth-secret

  - it: sets DATABASE_URL from db.existingSecret
    set:
      dub.appUrl: https://dub.example.com
      auth.existingSecret.name: dub-auth
      db.existingSecret.name: dub-db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: dub-db
                key: database-url

  - it: sets UPSTASH_REDIS_REST_URL from redis.upstash.restUrl when srh disabled
    set:
      dub.appUrl: https://dub.example.com
      auth.existingSecret.name: dub-auth
      db.existingSecret.name: dub-db
      redis.srh.enabled: false
      redis.upstash.restUrl: "https://my-redis.upstash.io"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UPSTASH_REDIS_REST_URL
            value: "https://my-redis.upstash.io"

  - it: sets UPSTASH_REDIS_REST_URL to http://localhost:80 when srh enabled
    set:
      dub.appUrl: https://dub.example.com
      auth.existingSecret.name: dub-auth
      db.existingSecret.name: dub-db
      redis.srh.enabled: true
      redis.srh.connectionString: "redis://my-redis:6379"
      redis.srh.existingSecret.name: dub-srh
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UPSTASH_REDIS_REST_URL
            value: "http://localhost:80"

  - it: pod has 2 containers when srh enabled
    set:
      dub.appUrl: https://dub.example.com
      auth.existingSecret.name: dub-auth
      db.existingSecret.name: dub-db
      redis.srh.enabled: true
      redis.srh.connectionString: "redis://my-redis:6379"
      redis.srh.existingSecret.name: dub-srh
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: srh

  - it: respects replicaCount
    set:
      dub.appUrl: https://dub.example.com
      auth.existingSecret.name: dub-auth
      db.existingSecret.name: dub-db
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: runs as non-root
    set:
      dub.appUrl: https://dub.example.com
      auth.existingSecret.name: dub-auth
      db.existingSecret.name: dub-db
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
