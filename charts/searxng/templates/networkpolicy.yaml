{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "searxng.fullname" . }}
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "searxng.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- $gateway := .Values.networkPolicy.ingress.gateway }}
    {{- if and (not (empty $gateway.namespaceSelector)) (not (empty $gateway.podSelector)) }}
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $gateway.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml $gateway.podSelector | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
  egress:
    {{- $dns := .Values.networkPolicy.egress.dns }}
    {{- if and $dns.enabled (not (empty $dns.namespaceSelector)) (not (empty $dns.podSelector)) }}
    - to:
        - namespaceSelector:
            matchLabels: {{- toYaml $dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml $dns.podSelector | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- $valkey := .Values.networkPolicy.egress.valkey }}
    {{- if and $valkey.enabled (not (empty $valkey.namespaceSelector)) (not (empty $valkey.podSelector)) }}
    - to:
        - namespaceSelector:
            matchLabels: {{- toYaml $valkey.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml $valkey.podSelector | nindent 14 }}
      ports:
        - port: {{ $valkey.port }}
          protocol: TCP
    {{- end }}
    {{- $internet := .Values.networkPolicy.egress.internet }}
    {{- if and $internet.enabled (not (empty $internet.cidrs)) }}
    - to:
        {{- range $internet.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
