{{- include "searxng.validateValkey" . }}
{{- $valkeyUrl := include "searxng.valkeyUrl" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "m11s-common.fullname" . }}
  labels:
    {{- include "m11s-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "m11s-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "m11s-common.podLabels" (dict "root" .) | nindent 8 }}
    spec:
      {{- if ne .Values.hostUsers nil }}
      hostUsers: {{ .Values.hostUsers }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "m11s-common.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: searxng
          image: {{ include "m11s-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          env:
            - name: SEARXNG_BASE_URL
              value: {{ required "searxng.baseURL is required" .Values.searxng.baseURL | quote }}
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "searxng.existingSecret.name is required" .Values.searxng.existingSecret.name }}
                  key: {{ .Values.searxng.existingSecret.secretKeyKey }}
            {{- if .Values.valkey.existingSecret.name }}
            - name: SEARXNG_VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.existingSecret.name }}
                  key: {{ .Values.valkey.existingSecret.urlKey }}
            {{- else if $valkeyUrl }}
            - name: SEARXNG_VALKEY_URL
              value: {{ $valkeyUrl | quote }}
            {{- end }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
              readOnly: true
            - name: data
              mountPath: /var/cache/searxng
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "m11s-common.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "m11s-common.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
