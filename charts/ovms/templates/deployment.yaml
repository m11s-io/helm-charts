{{- if not .Values.model.source }}
{{- fail "model.source is required" }}
{{- end }}
{{- if not .Values.model.task }}
{{- fail "model.task is required" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "m11s-common.fullname" . }}
  labels:
    {{- include "m11s-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "m11s-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "m11s-common.podLabels" . | nindent 8 }}
    spec:
      {{- if ne .Values.hostUsers nil }}
      hostUsers: {{ .Values.hostUsers }}
      {{- end }}
      serviceAccountName: {{ include "m11s-common.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ovms
          image: {{ include "m11s-common.image" (dict "root" . "image" .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --source_model
            - {{ .Values.model.source | quote }}
            - --model_repository_path
            - /models
            - --model_name
            - {{ .Values.model.name | default .Values.model.source | quote }}
            - --task
            - {{ .Values.model.task | quote }}
            - --target_device
            - {{ .Values.model.device | quote }}
            - --rest_port
            - {{ .Values.runtime.port | quote }}
            - --log_level
            - {{ .Values.runtime.logLevel | quote }}
            {{- with .Values.runtime.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: ovms-http, containerPort: {{ .Values.runtime.port }}, protocol: TCP}
          startupProbe:
            httpGet: {path: /v2/health/ready, port: ovms-http}
            {{- toYaml .Values.runtime.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet: {path: /v2/health/ready, port: ovms-http}
            {{- toYaml .Values.runtime.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet: {path: /v2/health/live, port: ovms-http}
            {{- toYaml .Values.runtime.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: model-cache, mountPath: /models}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: model-cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ovms.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
