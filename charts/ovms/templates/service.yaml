apiVersion: v1
kind: Service
metadata:
  name: {{ include "ovms.fullname" . }}
  labels:
    {{- include "ovms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ovms.selectorLabels" . | nindent 4 }}
  ports:
    - name: ovms-http
      port: {{ .Values.service.port }}
      targetPort: ovms-http
      protocol: TCP
