suite: ovms persistence
templates:
  - pvc.yaml
set:
  model.source: OpenVINO/Qwen3-Reranker-0.6B-seq-cls-fp16-ov
tests:
  - it: creates the configured cache claim
    set: {persistence.nameOverride: qwen-cache}
    asserts:
      - equal: {path: metadata.name, value: qwen-cache}
      - equal: {path: spec.resources.requests.storage, value: 2Gi}
  - it: creates no claim when using an existing claim
    set: {persistence.existingClaim: shared-models}
    asserts:
      - hasDocuments: {count: 0}
  - it: creates no claim for ephemeral cache
    set: {persistence.enabled: false}
    asserts:
      - hasDocuments: {count: 0}

  - it: uses the cluster default provisioner when storageClassName is null
    asserts:
      - notExists:
          path: spec.storageClassName
  - it: permits explicitly disabling dynamic provisioning with an empty class
    set: {persistence.storageClassName: ""}
    asserts:
      - exists:
          path: spec.storageClassName
      - equal:
          path: spec.storageClassName
          value: ""
  - it: renders a configured storage class name
    set: {persistence.storageClassName: fast-ssd}
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd
