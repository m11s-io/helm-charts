suite: ovms service
templates: [service.yaml]
set:
  model.source: OpenVINO/Qwen3-Reranker-0.6B-seq-cls-fp16-ov
tests:
  - it: exposes the OVMS REST API
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1
      - equal:
          path: spec.ports[0].name
          value: ovms-http
      - equal:
          path: spec.ports[0].port
          value: 8000
      - equal:
          path: spec.ports[0].targetPort
          value: ovms-http
  - it: honours a custom service port
    set:
      service.port: 9000
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9000
