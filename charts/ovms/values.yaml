nameOverride: ""
fullnameOverride: ""
replicaCount: 1
imagePullSecrets: []
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
# hostUsers sets spec.hostUsers on the pod. Requires user-namespace support
# (stable in Kubernetes 1.37; alpha/beta earlier) and a userns-capable runtime.
# Leave empty to use the cluster default; set false to run containers in a new
# user namespace.
# @schema type:[boolean, null]
hostUsers: null
nodeSelector: {}
tolerations: []
affinity: {}

model:
  # HuggingFace repository id (OVMS pull mode) or a path inside the model repository.
  source: ""
  # Name clients address the model by. Defaults to model.source when empty.
  name: ""
  # OVMS task graph to build. Determines which /v3 endpoint is served:
  #   rerank           -> /v3/rerank
  #   embeddings       -> /v3/embeddings
  #   text_generation  -> /v3/chat/completions, /v3/completions
  # Other values are passed through verbatim; see the OVMS docs for the full list.
  task: rerank
  # OpenVINO target device: CPU, GPU (Intel iGPU/Arc), NPU, or AUTO/MULTI/HETERO.
  # There is no CUDA target - OpenVINO does not run on NVIDIA GPUs.
  device: CPU

runtime:
  image:
    repository: openvino/model_server
    tag: 2026.3.1
    pullPolicy: IfNotPresent
  port: 8000
  logLevel: INFO
  # Extra arguments appended verbatim, for task-specific tuning
  # (e.g. ["--max_num_seqs", "64"]).
  extraArgs: []
  resources:
    requests: {cpu: "2", memory: 2Gi}
    limits: {memory: 4Gi}
  # Generous by default: a cold start downloads the model before serving.
  startupProbe: {periodSeconds: 10, failureThreshold: 180}
  readinessProbe: {periodSeconds: 10, failureThreshold: 3}
  livenessProbe: {initialDelaySeconds: 30, periodSeconds: 30, failureThreshold: 3}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}

persistence:
  enabled: true
  existingClaim: ""
  nameOverride: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 2Gi

service:
  type: ClusterIP
  port: 8000
