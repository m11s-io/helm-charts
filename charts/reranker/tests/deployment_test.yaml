suite: reranker deployment
templates: [deployment.yaml]
tests:
  - it: deploys OVMS and the Jina compatibility proxy
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].name
          value: proxy
      - equal:
          path: spec.template.spec.containers[1].name
          value: ovms
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "http://127.0.0.1:8000/v3/rerank"
      - contains:
          path: spec.template.spec.containers[1].args
          content: "--task"
      - equal:
          path: spec.template.spec.containers[1].securityContext.readOnlyRootFilesystem
          value: true
  - it: omits the proxy when disabled
    set:
      proxy.enabled: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: ovms
  - it: uses an ephemeral cache when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.volumes[0].emptyDir
  - it: uses an existing cache claim
    set:
      persistence.existingClaim: shared-models
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: shared-models
