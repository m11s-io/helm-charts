apiVersion: v2
name: decap-cms
description: Multi-tenant Decap CMS with optional S3/MinIO upload proxy, served by path prefix
type: application
version: 0.3.8
# renovate: datasource=docker depName=m11s/decap-cms
appVersion: "0.2.6-s3"
home: https://decapcms.org
icon: https://decapcms.org/img/decap-logo.svg
sources:
  - https://github.com/decaporg/decap-cms
  - https://github.com/m11s-io/docker-images
  - https://github.com/m11s-io/helm-charts
maintainers:
  - name: m11s
    url: https://m11s.io
annotations:
  artifacthub.io/signKey: |
    fingerprint: 6C1DF3F0731DDD4E9047086F039223E48A6FF51F
    url: https://keys.openpgp.org/search?q=hello%40m11s.io
  artifacthub.io/containersImages: |
    - name: decap-cms
      image: m11s/decap-cms:0.2.6-s3
    - name: s3-upload-proxy
      image: m11s/s3-upload-proxy:0.1.2
  artifacthub.io/changes: |-
    - kind: added
      description: "Optional S3/MinIO upload proxy (uploadProxy.enabled) deploys alongside the CMS and mounts at /upload on the same hostname — no second ingress needed"
    - kind: added
      description: "uploadProxy.s3.{endpoint,bucket,region,keyPrefix,publicUrl} configure the proxy; uploadProxy.existingSecret names a Secret with access_key and secret_key"
    - kind: changed
      description: "Tenants are now served at /<slug>/ path prefix on a single hostname instead of per-tenant subdomains"
    - kind: changed
      description: "Tenant field renamed from hostname to slug; httpRoute.hostnames is now required when httpRoute.enabled is true"
