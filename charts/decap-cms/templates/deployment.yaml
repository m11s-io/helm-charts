apiVersion: apps/v1
kind: Deployment
{{- include "decap-cms.validateTenantsSource" . }}
metadata:
  name: {{ include "decap-cms.fullname" . }}
  labels:
    {{- include "decap-cms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "decap-cms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/tenants: {{ .Values.tenants | toJson | sha256sum }}
        {{- if .Values.uploadProxy.enabled }}
        checksum/nginx-config: {{ include "decap-cms.nginxConfig" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "decap-cms.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "decap-cms.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: decap-cms
          image: {{ include "decap-cms.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: TENANTS_FILE
              value: {{ .Values.decapCms.tenantsFile | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.decapCms.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tenants-config
              mountPath: {{ .Values.decapCms.tenantsFile }}
              subPath: tenants.json
              readOnly: true
            - name: generated-html
              mountPath: /usr/share/nginx/html/tenants
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            {{- if .Values.uploadProxy.enabled }}
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            {{- end }}
        {{- if .Values.uploadProxy.enabled }}
        - name: upload-proxy
          image: {{ printf "%s:%s" .Values.uploadProxy.image.repository .Values.uploadProxy.image.tag | quote }}
          imagePullPolicy: {{ .Values.uploadProxy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: S3_ENDPOINT
              value: {{ .Values.uploadProxy.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.uploadProxy.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.uploadProxy.s3.region | quote }}
            - name: S3_KEY_PREFIX
              value: {{ .Values.uploadProxy.s3.keyPrefix | quote }}
            - name: S3_PUBLIC_URL
              value: {{ .Values.uploadProxy.s3.publicUrl | quote }}
            - name: PORT
              value: "8082"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.uploadProxy.existingSecret | quote }}
                  key: access_key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.uploadProxy.existingSecret | quote }}
                  key: secret_key
          ports:
            - name: upload-proxy
              containerPort: 8082
          readinessProbe:
            tcpSocket:
              port: upload-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: upload-proxy
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.uploadProxy.resources | nindent 12 }}
          volumeMounts:
            - name: upload-proxy-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: tenants-config
          {{- if .Values.existingTenantsPersistentVolumeClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.existingTenantsPersistentVolumeClaim }}
          {{- else }}
          configMap:
            name: {{ include "decap-cms.tenantsConfigMapName" . }}
          {{- end }}
        - name: generated-html
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        {{- if .Values.uploadProxy.enabled }}
        - name: nginx-config
          configMap:
            name: {{ include "decap-cms.fullname" . }}-nginx-config
        - name: upload-proxy-tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
