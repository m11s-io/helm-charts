{{- include "decap-cms.validateTenantsSource" . }}
{{- if and (not .Values.existingTenantsConfigMap) (not .Values.existingTenantsPersistentVolumeClaim) }}
{{- if not .Values.tenants }}
{{- fail "tenants must contain at least one tenant unless an existing tenant config source is set" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "decap-cms.tenantsConfigMapName" . }}
  labels:
    {{- include "decap-cms.labels" . | nindent 4 }}
data:
  tenants.json: |
    {{- .Values.tenants | toJson | nindent 4 }}
{{- end }}
