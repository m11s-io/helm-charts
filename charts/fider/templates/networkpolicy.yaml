{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fider.fullname" . }}
  labels:
    {{- include "fider.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fider.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.gatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    {{- if .Values.networkPolicy.dnsEgress.enabled }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    - to:
        {{- if .Values.networkPolicy.databaseNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.databaseNamespace }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.databasePort }}
          protocol: TCP
    {{- if .Values.networkPolicy.internetEgress.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.internetEgress.cidr }}
            {{- with .Values.networkPolicy.internetEgress.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- end }}
{{- end }}
