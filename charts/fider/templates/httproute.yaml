{{- if .Values.httpRoute.enabled -}}
{{- $hostnames := .Values.httpRoute.hostnames | default list -}}
{{- if and (eq .Values.fider.hostMode "multi") .Values.fider.hostDomain -}}
{{- $loginHost := printf "login.%s" .Values.fider.hostDomain -}}
{{- if not (has $loginHost $hostnames) -}}{{- $hostnames = append $hostnames $loginHost -}}{{- end -}}
{{- end -}}
{{- include "m11s-common.httpRoute" (dict "root" . "name" (include "m11s-common.fullname" .) "hostnames" $hostnames "port" .Values.service.port) -}}
{{- end -}}
