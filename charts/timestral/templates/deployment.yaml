{{- if and .Values.persistence.enabled (gt (int .Values.replicaCount) 1) }}
{{- fail "persistent model cache requires replicaCount <= 1; use separate releases or disable persistence" }}
{{- end }}
{{- if not .Values.model.id }}{{ fail "model.id is required" }}{{ end }}
{{- if not .Values.model.revision }}{{ fail "model.revision must be an immutable Hugging Face commit" }}{{ end }}
{{- if not (regexMatch "^[0-9a-fA-F]{40}$" .Values.model.revision) }}{{ fail "model.revision must be a 40-character Hugging Face commit" }}{{ end }}
{{- if not (or (eq .Values.model.device "cpu") (eq .Values.model.device "cuda")) }}{{ fail "model.device must be cpu or cuda" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "timestral.fullname" . }}
  labels:
    {{- include "timestral.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "timestral.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "timestral.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: timestral
          image: {{- if .Values.image.digest }} {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{- else }} {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}{{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: MODEL_ID, value: {{ .Values.model.id | quote }}}
            - {name: MODEL_REVISION, value: {{ .Values.model.revision | quote }}}
            - {name: MODEL_DEVICE, value: {{ .Values.model.device | quote }}}
            - {name: HF_HOME, value: /models/huggingface}
            - {name: TORCH_NUM_THREADS, value: {{ .Values.runtime.torchNumThreads | quote }}}
            - {name: MAX_REQUEST_BYTES, value: {{ .Values.runtime.limits.maxRequestBytes | int64 | toString | quote }}}
            - {name: MAX_BATCH_SIZE, value: {{ .Values.runtime.limits.maxBatchSize | int64 | toString | quote }}}
            - {name: MAX_ROWS_PER_SERIES, value: {{ .Values.runtime.limits.maxRowsPerSeries | int64 | toString | quote }}}
            - {name: MAX_CONTEXT_STEPS, value: {{ .Values.runtime.limits.maxContextSteps | int64 | toString | quote }}}
            - {name: MAX_PREDICTION_LENGTH, value: {{ .Values.runtime.limits.maxPredictionLength | int64 | toString | quote }}}
            - {name: MAX_OUTPUT_ELEMENTS, value: {{ .Values.runtime.limits.maxOutputElements | int64 | toString | quote }}}
            {{- with .Values.runtime.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ .Values.runtime.port }}, protocol: TCP}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            {{- toYaml .Values.runtime.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            {{- toYaml .Values.runtime.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            {{- toYaml .Values.runtime.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.runtime.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.runtime.securityContext | nindent 12 }}
          volumeMounts:
            - {name: model-cache, mountPath: /models}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: model-cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "timestral.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
