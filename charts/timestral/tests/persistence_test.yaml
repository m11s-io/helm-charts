suite: timestral cache volume
templates: [deployment.yaml]
tests:
  - it: mounts the generated persistent claim
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-timestral-model-cache
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /models
  - it: reuses an existing claim
    set:
      persistence.existingClaim: shared-hf-cache
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: shared-hf-cache
  - it: supports ephemeral cache storage
    set:
      persistence.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.volumes[0].emptyDir

---
suite: timestral persistent volume claim
templates: [pvc.yaml]
tests:
  - it: creates the cache claim with requested storage
    asserts:
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi
  - it: does not create a claim when an existing claim is configured
    set:
      persistence.existingClaim: shared-hf-cache
    asserts:
      - hasDocuments:
          count: 0
