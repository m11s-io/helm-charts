suite: timestral deployment
templates: [deployment.yaml]
tests:
  - it: renders secure single replica CPU defaults with bounded startup probes
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.containers[0].image
          value: m11s/timestral:1.0.0-cpu
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 180
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HF_HOME
            value: /models/huggingface
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MODEL_REVISION
            value: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_REQUEST_BYTES
            value: "8388608"
  - it: renders CUDA device, GPU allocation and scheduling configuration
    set:
      model.device: cuda
      image.tag: 1.0.0-cuda
      resources.limits:
        nvidia.com/gpu: 1
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: m11s/timestral:1.0.0-cuda
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MODEL_DEVICE
            value: cuda
      - equal:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
          value: 1
      - equal:
          path: spec.template.spec.nodeSelector["nvidia.com/gpu.present"]
          value: "true"
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: nvidia.com/gpu
  - it: renders integer API limit overrides as decimal environment strings
    set:
      runtime.limits:
        maxRequestBytes: 2097152
        maxBatchSize: 2
        maxRowsPerSeries: 16
        maxContextSteps: 4096
        maxPredictionLength: 96
        maxOutputElements: 123456
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_REQUEST_BYTES, value: "2097152"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_BATCH_SIZE, value: "2"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_ROWS_PER_SERIES, value: "16"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_CONTEXT_STEPS, value: "4096"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_PREDICTION_LENGTH, value: "96"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_OUTPUT_ELEMENTS, value: "123456"}
  - it: uses an immutable image digest when supplied
    set:
      image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: m11s/timestral@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - it: passes secret-backed environment variables through
    set:
      runtime.extraEnv:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: model-access
              key: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: model-access
                key: token
  - it: selects the configured NVIDIA runtime class
    set:
      runtimeClassName: nvidia
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia
  - it: leaves runtime class to the cluster by default
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName
  - it: renders the shipped AMD ROCm configuration with secure defaults
    values:
      - ../examples/rocm-values.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: m11s/timestral:1.0.0-rocm
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MODEL_DEVICE
            value: cuda
      - equal:
          path: spec.template.spec.containers[0].resources.limits["amd.com/gpu"]
          value: 1
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: sets hostUsers when configured
    set:
      hostUsers: false
    asserts:
      - equal:
          path: spec.template.spec.hostUsers
          value: false

  - it: omits hostUsers by default
    asserts:
      - notExists:
          path: spec.template.spec.hostUsers
