apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "comfyui.fullname" . }}
  labels:
    {{- include "comfyui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "comfyui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "comfyui.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "comfyui.serviceAccountName" . }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      containers:
        - name: comfyui
          image: {{ include "comfyui.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.environment }}
          env:
            {{- range $key, $value := .Values.environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.nfsModels.enabled }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: models
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.nfsModels.enabled }}
            - name: nfs-models
              mountPath: {{ .Values.nfsModels.mountPath }}
            {{- if .Values.nfsModels.categories }}
            - name: extra-model-paths
              mountPath: /app/extra_model_paths.yaml
              subPath: extra_model_paths.yaml
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.nfsModels.enabled }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "comfyui.modelsClaimName" . }}
        {{- end }}
        {{- if .Values.nfsModels.enabled }}
        - name: nfs-models
          persistentVolumeClaim:
            claimName: {{ include "comfyui.nfsModelsClaimName" . }}
        {{- if .Values.nfsModels.categories }}
        - name: extra-model-paths
          configMap:
            name: {{ include "comfyui.extraModelPathsConfigMapName" . }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
