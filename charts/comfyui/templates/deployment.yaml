{{- $persistencePaths := dict }}
{{- range $name, $config := dict "persistence" .Values.persistence "outputPersistence" .Values.outputPersistence "userPersistence" .Values.userPersistence "inputPersistence" .Values.inputPersistence "tempPersistence" .Values.tempPersistence }}
{{- if $config.enabled }}
{{- if hasKey $persistencePaths $config.mountPath }}
{{- fail (printf "%s.mountPath and %s.mountPath must differ" (get $persistencePaths $config.mountPath) $name) }}
{{- end }}
{{- $_ := set $persistencePaths $config.mountPath $name }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "comfyui.fullname" . }}
  labels:
    {{- include "comfyui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "comfyui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "comfyui.selectorLabels" . | nindent 8 }}
        {{- if .Values.comfyMcp.enabled }}
        app.kubernetes.io/component: comfy-mcp
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "comfyui.serviceAccountName" . }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      containers:
        - name: comfyui
          image: {{ include "comfyui.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.environment }}
          env:
            {{- range $key, $value := .Values.environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.outputPersistence.enabled .Values.userPersistence.enabled .Values.inputPersistence.enabled .Values.tempPersistence.enabled }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: models
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.outputPersistence.enabled }}
            - name: output
              mountPath: {{ .Values.outputPersistence.mountPath }}
            {{- end }}
            {{- if .Values.userPersistence.enabled }}
            - name: user
              mountPath: {{ .Values.userPersistence.mountPath }}
            {{- end }}
            {{- if .Values.inputPersistence.enabled }}
            - name: input
              mountPath: {{ .Values.inputPersistence.mountPath }}
            {{- end }}
            {{- if .Values.tempPersistence.enabled }}
            - name: temp
              mountPath: {{ .Values.tempPersistence.mountPath }}
            {{- end }}
          {{- end }}
        {{- if .Values.comfyMcp.enabled }}
        - name: comfy-mcp
          image: {{ printf "%s:%s" .Values.comfyMcp.image.repository .Values.comfyMcp.image.tag }}
          imagePullPolicy: {{ .Values.comfyMcp.image.pullPolicy }}
          args: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8080"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          env:
            - name: COMFY_LOCAL_URL
              value: http://127.0.0.1:8188
            - name: COMFYUI_URL
              value: http://127.0.0.1:8188
            - name: COMFY_MCP_TRANSPORT
              value: streamable-http
            - name: COMFY_MCP_HOST
              value: 0.0.0.0
            - name: COMFY_MCP_PORT
              value: "8080"
          readinessProbe:
            exec:
              command: ["python", "/opt/comfy-mcp-image/healthcheck.py"]
          livenessProbe:
            exec:
              command: ["python", "/opt/comfy-mcp-image/healthcheck.py"]
          resources:
            {{- toYaml .Values.comfyMcp.resources | nindent 12 }}
        {{- end }}
      {{- if or .Values.persistence.enabled .Values.outputPersistence.enabled .Values.userPersistence.enabled .Values.inputPersistence.enabled .Values.tempPersistence.enabled }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "comfyui.modelsClaimName" . }}
        {{- end }}
        {{- if .Values.outputPersistence.enabled }}
        - name: output
          persistentVolumeClaim:
            claimName: {{ include "comfyui.outputClaimName" . }}
        {{- end }}
        {{- if .Values.userPersistence.enabled }}
        - name: user
          persistentVolumeClaim:
            claimName: {{ include "comfyui.userClaimName" . }}
        {{- end }}
        {{- if .Values.inputPersistence.enabled }}
        - name: input
          persistentVolumeClaim:
            claimName: {{ include "comfyui.inputClaimName" . }}
        {{- end }}
        {{- if .Values.tempPersistence.enabled }}
        - name: temp
          persistentVolumeClaim:
            claimName: {{ include "comfyui.tempClaimName" . }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
