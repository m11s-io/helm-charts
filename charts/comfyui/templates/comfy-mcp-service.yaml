{{- if .Values.comfyMcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "comfyui.comfyMcpFullname" . }}
  labels:
    {{- include "comfyui.labels" . | nindent 4 }}
    app.kubernetes.io/component: comfy-mcp
spec:
  type: {{ .Values.comfyMcp.service.type }}
  ports:
    - name: mcp
      port: {{ .Values.comfyMcp.service.port }}
      targetPort: mcp
      protocol: TCP
  selector:
    {{- include "comfyui.comfyMcpSelectorLabels" . | nindent 4 }}
{{- end }}
