{{- if .Values.comfyMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "comfyui.comfyMcpFullname" . }}
  labels:
    {{- include "comfyui.labels" . | nindent 4 }}
    app.kubernetes.io/component: comfy-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "comfyui.comfyMcpSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "comfyui.comfyMcpSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "comfyui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: comfy-mcp
          image: {{ printf "%s:%s" .Values.comfyMcp.image.repository .Values.comfyMcp.image.tag }}
          imagePullPolicy: {{ .Values.comfyMcp.image.pullPolicy }}
          args: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8080"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          env:
            - name: COMFYUI_URL
              value: {{ printf "http://%s:%v" (include "comfyui.fullname" .) .Values.service.port | quote }}
            - name: COMFY_MCP_TRANSPORT
              value: streamable-http
            - name: COMFY_MCP_HOST
              value: 0.0.0.0
            - name: COMFY_MCP_PORT
              value: "8080"
          readinessProbe:
            exec:
              command: ["python", "/opt/comfy-mcp-image/healthcheck.py"]
          livenessProbe:
            exec:
              command: ["python", "/opt/comfy-mcp-image/healthcheck.py"]
          resources:
            {{- toYaml .Values.comfyMcp.resources | nindent 12 }}
{{- end }}
