{{- if .Values.modelDownload.enabled }}
{{- if not .Values.persistence.enabled }}
{{- fail "modelDownload.enabled requires persistence.enabled" }}
{{- end }}
{{- if not .Values.modelDownload.models }}
{{- fail "modelDownload.enabled requires at least one model" }}
{{- end }}
{{- range .Values.modelDownload.models }}
{{- if or (hasPrefix "/" .destination) (contains ".." .destination) }}
{{- fail "modelDownload.models[].destination must be a relative path without '..'" }}
{{- end }}
{{- end }}
{{- $workloadImageTag := default .Chart.AppVersion .Values.image.tag }}
{{- $workloadImage := printf "%s:%s" .Values.image.repository $workloadImageTag }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- $modelSpecHash := printf "%s:%s:%s" .Chart.Version (.Values.modelDownload.models | toJson) (.Values.modelDownload.prune | toJson) | sha256sum | trunc 8 }}
  name: {{ include "comfyui.fullname" . }}-model-download-{{ $modelSpecHash }}
  labels:
    {{- include "comfyui.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-download
spec:
  backoffLimit: {{ .Values.modelDownload.backoffLimit }}
  {{- if ne .Values.modelDownload.ttlSecondsAfterFinished nil }}
  ttlSecondsAfterFinished: {{ .Values.modelDownload.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "comfyui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: model-download
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "comfyui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: model-download
          image: {{ default $workloadImage .Values.modelDownload.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.modelDownload.huggingFaceToken.existingSecret }}
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.modelDownload.huggingFaceToken.key }}
          {{- end }}
          command:
            - /bin/sh
            - -ec
            - |
              models_root="{{ $.Values.persistence.mountPath }}"
              cache_dir="$models_root/.cache/huggingface"

              is_desired_model() {
                case "$1" in
                {{- range .Values.modelDownload.models }}
                  {{ .destination | quote }}) return 0 ;;
                {{- end }}
                  *) return 1 ;;
                esac
              }

              is_managed_directory() {
                case "$1" in
                {{- range .Values.modelDownload.models }}
                  {{ (index (splitList "/" .destination) 0) | quote }}) return 0 ;;
                {{- end }}
                  *) return 1 ;;
                esac
              }

              download() {
                destination="$1"
                repo="$2"
                revision="$3"
                file="$4"
                expected_sha256="$5"
                label="$6"
                partial="${destination}.part"

                echo "[model-download] START model=$label destination=$destination repo=$repo revision=$revision file=$file"
                mkdir -p "$(dirname "$destination")"
                if [ -f "$destination" ]; then
                  if printf '%s  %s\n' "$expected_sha256" "$destination" | sha256sum -c - >/dev/null; then
                    echo "[model-download] VERIFIED model=$label destination=$destination state=already-present"
                    return
                  fi
                  echo "[model-download] INVALID model=$label destination=$destination action=remove" >&2
                  rm -f "$destination"
                fi

                if [ -f "$partial" ]; then
                  echo "[model-download] REMOVE_PARTIAL model=$label reason=legacy-or-unverified"
                  rm -f "$partial"
                fi

                mkdir -p "$cache_dir"
                cache_before=$(du -sk "$cache_dir" 2>/dev/null | awk '{printf "%.0f", $1 * 1024}')
                cache_before=${cache_before:-0}
                echo "[model-download] FETCH model=$label cache_dir=$cache_dir"
                (
                  cached_file=$(HF_HOME="$cache_dir" HF_HUB_DISABLE_PROGRESS_BARS=1 HF_HUB_DISABLE_UPDATE_CHECK=1 HF_HUB_CACHE="$cache_dir" \
                    hf download "$repo" "$file" --revision "$revision" --cache-dir "$cache_dir" --quiet)
                  cache_blob=$(readlink -f "$cached_file")
                  ln "$cache_blob" "$partial"
                ) &
                download_pid=$!
                while kill -0 "$download_pid" 2>/dev/null; do
                  cache_now=$(du -sk "$cache_dir" 2>/dev/null | awk '{printf "%.0f", $1 * 1024}')
                  cache_now=${cache_now:-0}
                  echo "[model-download] PROGRESS model=$label cache_delta_bytes=$((cache_now - cache_before))"
                  sleep 30
                done
                if ! wait "$download_pid"; then
                  echo "[model-download] FAILED model=$label phase=transfer" >&2
                  return 1
                fi
                echo "[model-download] TRANSFER_COMPLETE model=$label source=hf-cli"

                if ! printf '%s  %s\n' "$expected_sha256" "$partial" | sha256sum -c - >/dev/null; then
                  echo "[model-download] FAILED model=$label phase=checksum expected_sha256=$expected_sha256" >&2
                  return 1
                fi
                echo "[model-download] CHECKSUM_OK model=$label sha256=$expected_sha256"
                mv "$partial" "$destination"
                echo "[model-download] COMPLETE model=$label destination=$destination"
              }
              {{- range .Values.modelDownload.models }}
              download {{ printf "%s/%s" $.Values.persistence.mountPath .destination | quote }} {{ .repo | quote }} {{ .revision | quote }} {{ .file | quote }} {{ .sha256 | quote }} {{ .destination | quote }}
              {{- end }}
              {{- if .Values.modelDownload.prune.enabled }}
              echo "[model-download] PRUNE_START scope=derived-from-model-destinations"
              find "$models_root" -type f -print0 | while IFS= read -r -d '' existing; do
                relative="${existing#"$models_root"/}"
                directory="${relative%%/*}"
                if [ "$directory" = "$relative" ]; then
                  continue
                fi
                if is_managed_directory "$directory" && ! is_desired_model "$relative"; then
                  echo "[model-download] PRUNE_REMOVE destination=$relative"
                  rm -f "$existing"
                fi
              done
              echo "[model-download] PRUNE_COMPLETE"
              {{- end }}
              echo "[model-download] CACHE_REMOVE path=$cache_dir"
              rm -rf "$cache_dir"
          resources:
            {{- toYaml .Values.modelDownload.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "comfyui.modelsClaimName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
