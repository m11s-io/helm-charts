suite: comfyui model download Job
templates:
  - model-download-job.yaml

tests:
  - it: does not render a model download Job by default
    asserts:
      - hasDocuments:
          count: 0

  - it: downloads configured models to the persistent models PVC
    set:
      persistence.enabled: true
      modelDownload:
        enabled: true
        models:
          - destination: diffusion_models/example.safetensors
            repo: example-org/example-model
            revision: 0123456789abcdef0123456789abcdef01234567
            file: split_files/diffusion_models/example.safetensors
            sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-comfyui-models
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /app/models
      - equal:
          path: spec.template.spec.containers[0].image
          value: m11s/comfyui:0.5.3-gguf
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 3Gi
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "START model="
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "PROGRESS model="
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'hf download "\$repo" "\$file" --revision "\$revision" --cache-dir "\$cache_dir" --quiet'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'cached_file=\$\('
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'cache_blob=\$\(readlink -f "\$cached_file"\)'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'HF_HUB_DISABLE_PROGRESS_BARS=1'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'HF_HOME="\$cache_dir"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'HF_HUB_DISABLE_UPDATE_CHECK=1'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "awk '\\{printf \\\"%.0f\\\", \\$1 \\* 1024\\}'"

  - it: injects an optional Hugging Face token from an existing Secret
    set:
      persistence.enabled: true
      modelDownload:
        enabled: true
        huggingFaceToken:
          existingSecret: comfyui-hf-token
          key: token
        models:
          - destination: diffusion_models/example.safetensors
            repo: example-org/example-model
            revision: 0123456789abcdef0123456789abcdef01234567
            file: split_files/diffusion_models/example.safetensors
            sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: HF_TOKEN
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: comfyui-hf-token
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: token
