suite: comfyui network policy
templates:
  - networkpolicy.yaml

tests:
  - it: renders nothing when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: permits only configured Gateway and DNS workloads
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.gateway.namespaceSelector.kubernetes.io/metadata.name: gateway
      networkPolicy.ingress.gateway.podSelector.app.kubernetes.io/name: envoy-gateway
      networkPolicy.egress.dns.namespaceSelector.kubernetes.io/metadata.name: kube-system
      networkPolicy.egress.dns.podSelector.k8s-app: kube-dns
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels.app\.kubernetes\.io/name
          value: envoy-gateway
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels.k8s-app
          value: kube-dns
