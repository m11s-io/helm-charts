suite: comfyui deployment
templates:
  - deployment.yaml

tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "m11s/comfyui:[0-9]+\\.[0-9]+\\.[0-9]+"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: does not set runtimeClassName by default
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: sets runtimeClassName when configured
    set:
      runtimeClassName: nvidia
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia

  - it: does not mount a models volume by default
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: mounts the models PVC when persistence is enabled
    set:
      persistence.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-comfyui-models
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /app/models

  - it: uses existingClaim for the models volume when set
    set:
      persistence.enabled: true
      persistence.existingClaim: my-existing-pvc
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-existing-pvc

  - it: mounts independently configurable output, user, input, and temporary PVCs
    set:
      outputPersistence:
        enabled: true
        existingClaim: output-pvc
      userPersistence:
        enabled: true
        existingClaim: user-pvc
      inputPersistence:
        enabled: true
        existingClaim: input-pvc
      tempPersistence:
        enabled: true
        existingClaim: temp-pvc
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value: {name: output, mountPath: /app/output}
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[3]
          value: {name: temp, mountPath: /app/temp}
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: output-pvc
      - equal:
          path: spec.template.spec.volumes[3].persistentVolumeClaim.claimName
          value: temp-pvc

  - it: defaults to Recreate strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: respects replicaCount
    set:
      replicaCount: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: uses fullnameOverride
    set:
      fullnameOverride: custom-name
    asserts:
      - equal:
          path: metadata.name
          value: custom-name

  - it: drops all capabilities in securityContext
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: runs as the comfyui uid by default
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001

  - it: sets nvidia.com/gpu resources when configured
    set:
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits
          value:
            nvidia.com/gpu: "1"

  - it: adds MCP as a colocated sidecar without a second GPU
    set:
      comfyMcp.enabled: true
      persistence.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: comfy-mcp
      - equal:
          path: spec.template.spec.containers[1].image
          value: m11s/comfy-mcp:0.2.2
      - equal:
          path: spec.template.spec.containers[1].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[1].args[0]
          value: --transport
      - equal:
          path: spec.template.spec.containers[1].env[0]
          value:
            name: COMFY_LOCAL_URL
            value: http://127.0.0.1:8188
      - equal:
          path: spec.template.spec.containers[1].env[1]
          value:
            name: COMFYUI_URL
            value: http://127.0.0.1:8188
      - equal:
          path: spec.template.spec.containers[1].resources.requests.cpu
          value: 50m
      - notExists:
          path: spec.template.spec.containers[1].volumeMounts

  - it: sets hostUsers when provided
    set:
      hostUsers: false
    asserts:
      - equal:
          path: spec.template.spec.hostUsers
          value: false

  - it: omits hostUsers by default
    asserts:
      - notExists:
          path: spec.template.spec.hostUsers
